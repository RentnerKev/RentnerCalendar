[install]
minimumReleaseAge = 86400
# Coordinated, verified releases of our own packages can be adopted immediately.
minimumReleaseAgeExcludes = ["@rentnerkev/calendar", "@rentnerkev/tooltips"]
linker = "isolated"
globalStore = false
[test]
root = "src/tests"
pathIgnorePatterns = ["**/*.db.test.ts", "**/browser/**"]

# The empty .oxfmtrc.json preserves Bun's Oxfmt output mode.
[fmt]
semi = false
singleQuote = true
trailingComma = "all"
tabWidth = 4
useTabs = false
printWidth = 80
sortPackageJson = false
ignorePatterns = [
    "dist/",
    "build/",
    "node_modules/",
    "bun.lock",
    "drizzle/**",
    "**/drizzle/**",
    ".env",
    "**/.env",
    "**/.env.*",
    "playground/dist/**",
    "playground/node_modules/**",
    "test-results/**",
    "playwright-report/**",
    "**/routeTree.gen.*",
    "**/bindings/**",
    "target/**",
]
